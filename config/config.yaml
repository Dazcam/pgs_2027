##  Shared settings  ------------------------------------------------------------------

containers:
  prs: ../resources/containers/prs.sif

# GWAS summary statistics, stored as ../resources/gwas/<gwas>/<file>
#   Source (00SETUP)
#     download: true    fetched from url
#     download: false   copied in by hand (collaborator files have no url)
#     token: true       send the Figshare API token (figshare blocks downloads without it)
#     md5               optional; quote it so YAML keeps it as a string
#   Format (02PREP-GWAS)
#     delim             tab | space
#     cols              raw column names for snp, a1 (effect allele), a2, effect, se, p,
#                       freq (allele frequency, used by n: auto) and info (null if absent)
#     effect_type       beta | or (or is converted to log(OR))
#     trait_type        binary | continuous (sets the n: auto formula; GenomicSEM factors
#                       are continuous)
#     qc_cols           columns that must equal 0 to keep a SNP (GenomicSEM error/warning)
#     n                 per-SNP N; n_gwas is their summary (prep_gwas: n_summary)
#                         column        col x scale
#                         case_control  4 / (1/cases + 1/controls)
#                         fixed         value
#                         auto          Mallard et al.: k / (2f(1-f)SE^2), k = 4 binary,
#                                       1 continuous, SNPs with MAF in prep_gwas: auto_maf
gwas:
  adhd2022:
    url: https://api.figshare.com/v2/file/download/40036684
    download: true
    token: true
    file: ADHD2022_iPSYCH_deCODE_PGC.meta.gz
    md5: "ea57120c720e880e34f67f57483dcbb4"
    delim: space
    cols: {snp: SNP, a1: A1, a2: A2, effect: OR, se: SE, p: P, freq: FRQ_U_186843, info: INFO}
    effect_type: or
    trait_type: binary
    qc_cols: []
    n: {method: case_control, cases: Nca, controls: Nco}
  anx2024:
    url: https://zenodo.org/api/records/13135834/files/ANX_EUR.txt.gz/content
    download: true
    token: false
    file: ANX_EUR.txt.gz
    md5: "ad2528571d852b0e2d254a28a35c8aae"
    delim: space
    cols: {snp: SNP, a1: A1, a2: A2, effect: BETA, se: SE, p: P, freq: MAF, info: null}
    effect_type: beta
    trait_type: continuous
    qc_cols: []
    n: {method: auto}
  asd2019:
    url: https://api.figshare.com/v2/file/download/28169292
    download: true
    token: true
    file: iPSYCH-PGC_ASD_Nov2017
    md5: "5ca46780db3b37038bd02bd20c38c85c"
    delim: tab
    cols: {snp: SNP, a1: A1, a2: A2, effect: OR, se: SE, p: P, freq: null, info: INFO}
    effect_type: or
    trait_type: binary
    qc_cols: []
    n: {method: fixed, value: 44367}   # no N or frequency in file; 18,381 cases, 27,969 controls
  bip2024:
    url: https://api.figshare.com/v2/file/download/49760772
    download: true
    token: true
    file: bip2024_eur_no23andMe.gz
    md5: "ee30cead54d61a015dd71b773d442da0"
    delim: space
    cols: {snp: SNP, a1: A1, a2: A2, effect: OR, se: SE, p: P, freq: HRC_FRQ_A1, info: INFO}
    effect_type: or
    trait_type: binary
    qc_cols: []
    n: {method: column, col: Neff_half, scale: 2}
  mdd2025:
    url: https://api.figshare.com/v2/file/download/51487022
    download: true
    token: true
    file: pgc-mdd2025_no23andMe-noUKBB_eur_v3-49-24-11.tsv.gz
    md5: "29d3ce57cfce19ca28eb1643d9e2e428"
    delim: tab
    cols: {snp: ID, a1: EA, a2: NEA, effect: BETA, se: SE, p: PVAL, freq: FCON, info: IMPINFO}
    effect_type: beta
    trait_type: binary
    qc_cols: []
    n: {method: column, col: NEFF, scale: 1}
  scz2022:
    url: https://api.figshare.com/v2/file/download/34517828
    download: true
    token: true
    file: PGC3_SCZ_wave3.european.autosome.public.v3.vcf.tsv.gz
    md5: "6ebe2376f5cda972d37efa0f214c4df0"
    delim: tab
    cols: {snp: ID, a1: A1, a2: A2, effect: BETA, se: SE, p: PVAL, freq: FCON, info: IMPINFO}
    effect_type: beta
    trait_type: binary
    qc_cols: []
    n: {method: column, col: NEFF, scale: 2}   # NEFF appears to be half the effective N
  anx2024_adj_adhd2022:
    url: null
    download: false
    token: false
    file: anx2024_adj_adhd2022.fastGWA
    md5: "1f20effd5ed28ef9c6944f359748ad58"
    delim: tab
    cols: {snp: SNP, a1: A1, a2: A2, effect: BETA, se: SE, p: P, freq: AF1, info: null}
    effect_type: beta
    trait_type: continuous
    qc_cols: [error, warning]
    n: {method: column, col: N, scale: 1}
  mdd2025_adj_adhd2022:
    url: null
    download: false
    token: false
    file: mdd2025_adj_adhd2022.fastGWA
    md5: "f7830a1097b0be0228c7c3500c9aea09"
    delim: tab
    cols: {snp: SNP, a1: A1, a2: A2, effect: BETA, se: SE, p: P, freq: AF1, info: null}
    effect_type: beta
    trait_type: continuous
    qc_cols: [error, warning]
    n: {method: column, col: N, scale: 1}
  cortical_expansion:
    url: null
    download: false
    token: false
    file: cortical_expansion.fastGWA
    md5: "d742cb74b3628522da7154db43c2c3e1"
    delim: tab
    cols: {snp: SNP, a1: A1, a2: A2, effect: BETA, se: SE, p: P, freq: AF1, info: null}
    effect_type: beta
    trait_type: continuous
    qc_cols: []
    n: {method: column, col: N, scale: 1}

##  00SETUP  --------------------------------------------------------------------------

setup:
  get_containers:
    uris:
      prs: oras://quay.io/dazcam1/prs-bigsnpr:latest
    script: scripts/setup_pull_containers.sh
    output: ../resources/containers/.get_containers.done
    benchmark: reports/benchmarks/00setup.get_containers.benchmark.txt
    log: ../results/00LOG/00SETUP/get_containers.log
  get_prscs:
    repo: https://github.com/getian107/PRScs.git
    commit: fbc9ec017652f0b40a6ab47f63747d97fa7d033b
    dir: ../resources/software/PRScs
    output: ../resources/software/PRScs/.get_prscs.done
    benchmark: reports/benchmarks/00setup.get_prscs.benchmark.txt
    log: ../results/00LOG/00SETUP/get_prscs.log
  get_prscs_ref:
    url: https://www.dropbox.com/s/t9opx2ty6ucrpib/ldblk_ukbb_eur.tar.gz?dl=1
    tarball: ../resources/refs/ldblk_ukbb_eur.tar.gz
    dir: ../resources/refs
    ld_dir: ../resources/refs/ldblk_ukbb_eur
    output: ../resources/refs/ldblk_ukbb_eur/.get_prscs_ref.done
    benchmark: reports/benchmarks/00setup.get_prscs_ref.benchmark.txt
    log: ../results/00LOG/00SETUP/get_prscs_ref.log
  get_gwas_sumstats:
    dir: ../resources/gwas/{gwas}
    figshare_token: ../config/passwords/figshare_token
    output: ../resources/gwas/{gwas}/.get_gwas_sumstats.done
    benchmark: reports/benchmarks/00setup.get_gwas_sumstats_{gwas}.benchmark.txt
    log: ../results/00LOG/00SETUP/get_gwas_sumstats_{gwas}.log

##  01GENOTYPES  ----------------------------------------------------------------------

genotypes:
  # Final eQTL atlas genotypes (134 QC'd samples), copied in by hand
  vcf: ../resources/genotypes/eqtl_atlas_genotypes.vcf.gz
  vcf_md5: "6e6b663b7d386e00078567ac78440178"
  sample_sheet: ../resources/sheets/eQTL_study_2025_sample_anns.xlsx
  euro_samples:
    sheet: Sheet1
    id_col: sample ID
    ancestry_col: ancestry
    ancestry: European
    script: ../scripts/geno_euro_samples.R
    output: ../results/01GENOTYPES/euro_samples.txt
    benchmark: reports/benchmarks/01genotypes.euro_samples.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/euro_samples.log
  subset_vcf:
    output: ../results/01GENOTYPES/eqtl_atlas_genotypes.euro.vcf.gz
    benchmark: reports/benchmarks/01genotypes.subset_vcf.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/subset_vcf.log
  vcf_to_plink:
    prefix: ../results/01GENOTYPES/eqtl_atlas_genotypes.euro
    output: ../results/01GENOTYPES/eqtl_atlas_genotypes.euro.bed
    benchmark: reports/benchmarks/01genotypes.vcf_to_plink.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/vcf_to_plink.log
  ld_prune:
    maf: 0.01
    indep_pairwise: 250 5 0.2
    prefix: ../results/01GENOTYPES/pca/ld_prune
    output: ../results/01GENOTYPES/pca/ld_prune.prune.in
    benchmark: reports/benchmarks/01genotypes.ld_prune.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/ld_prune.log
  genotype_pcs:
    pcs: 10
    prefix: ../results/01GENOTYPES/pca/pca
    output: ../results/01GENOTYPES/pca/pca.eigenvec
    benchmark: reports/benchmarks/01genotypes.genotype_pcs.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/genotype_pcs.log

##  02PREP-GWAS  ----------------------------------------------------------------------

prep_gwas:
  format_gwas:
    # QC settings (applied to every GWAS; null switches a filter off)
    info_min: 0.8            # minimum INFO, where the GWAS has an INFO column
    drop_ambiguous: true     # drop strand-ambiguous SNPs (A/T, C/G)
    drop_duplicates: true    # drop SNP IDs that appear more than once
    n_min_frac: null         # drop SNPs with N < n_min_frac x 90th percentile N (column / case_control only)
    n_summary: median        # median | mean of per-SNP N, used as PRS-CS n_gwas
    auto_maf: [0.1, 0.4]     # MAF window for n: auto
    script: ../scripts/gwas_format.R
    sumstats: ../results/02PREP-GWAS/{gwas}/{gwas}.prscs.txt
    n_gwas: ../results/02PREP-GWAS/{gwas}/{gwas}.n_gwas.txt
    qc: ../results/02PREP-GWAS/{gwas}/{gwas}.qc.tsv
    benchmark: reports/benchmarks/02prep_gwas.format_gwas_{gwas}.benchmark.txt
    log: ../results/00LOG/02PREP-GWAS/format_gwas_{gwas}.log

##  03PRS  ----------------------------------------------------------------------------

# {tag} in a path is filled from the PRS-CS settings, as PRS-CS names its own output:
# a<a>_b<b>_phi<phi> (e.g. a1_b0.5_phi1e-02, or a1_b0.5_phiauto when phi is null)
prs:
  vcf_to_pgen:
    prefix: ../results/03PRS/genotypes/eqtl_atlas_genotypes.euro.dosage
    output: ../results/03PRS/genotypes/eqtl_atlas_genotypes.euro.dosage.pgen
    benchmark: reports/benchmarks/03prs.vcf_to_pgen.benchmark.txt
    log: ../results/00LOG/03PRS/vcf_to_pgen.log
  run_prscs:
    a: 1
    b: 0.5
    phi: 1.0e-2              # null = PRS-CS-auto
    n_iter: 1000
    n_burnin: 500
    thin: 5
    seed: 1
    env: ../envs/prscs.yaml
    out_prefix: ../results/03PRS/prscs/{gwas}/{gwas}
    output: ../results/03PRS/prscs/{gwas}/{gwas}_pst_eff_{tag}_chr{chr}.txt
    benchmark: reports/benchmarks/03prs.run_prscs_{gwas}_{tag}_chr{chr}.benchmark.txt
    log: ../results/00LOG/03PRS/run_prscs_{gwas}_{tag}_chr{chr}.log
  combine_weights:
    output: ../results/03PRS/weights/{gwas}_{tag}.weights.txt
    benchmark: reports/benchmarks/03prs.combine_weights_{gwas}_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/combine_weights_{gwas}_{tag}.log
  score:
    prefix: ../results/03PRS/scores/{gwas}_{tag}
    output: ../results/03PRS/scores/{gwas}_{tag}.sscore
    benchmark: reports/benchmarks/03prs.score_{gwas}_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/score_{gwas}_{tag}.log
  combine_scores:
    sex_col: sex
    pcw_col: PCW
    script: ../scripts/prs_combine_scores.R
    scores: ../results/03PRS/pgs_scores_{tag}.tsv
    summary: ../results/03PRS/pgs_summary_{tag}.tsv
    benchmark: reports/benchmarks/03prs.combine_scores_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/combine_scores_{tag}.log

