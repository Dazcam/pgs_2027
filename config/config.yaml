    token: true
    file: bip2024_eur_no23andMe.gz
    md5: "ee30cead54d61a015dd71b773d442da0"
  mdd2025:
    url: https://api.figshare.com/v2/file/download/51487022
    download: true
    token: true
    file: pgc-mdd2025_no23andMe-noUKBB_eur_v3-49-24-11.tsv.gz
    md5: "29d3ce57cfce19ca28eb1643d9e2e428"
  scz2022:
    url: https://api.figshare.com/v2/file/download/34517828
