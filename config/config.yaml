##  Shared settings  ---------------------------------------------------------------------

containers:
  prs: ../resources/containers/prs.sif

# GWAS summary statistics
#   Public files are downloaded in 00SETUP from url and saved as file.
#   md5 is optional; quote it so YAML keeps it as a string.
#   Collaborator files (url: null) are copied by hand to ../resources/gwas/<gwas>/<file>.
gwas:
  adhd2022:
    url: https://figshare.com/ndownloader/files/40036684
    file: ADHD2022_iPSYCH_deCODE_PGC.meta.gz
    md5: null
  anx2024:
    url: https://zenodo.org/records/13135834/files/ANX_EUR.txt.gz?download=1
    file: ANX_EUR.txt.gz
    md5: "ad2528571d852b0e2d254a28a35c8aae"
  asd2019:
    url: null
    file: null
    md5: null
  bip2024:
    url: https://figshare.com/ndownloader/files/49760772
    file: bip2024_eur_no23andMe.gz
    md5: null
  mdd2025:
    url: https://figshare.com/ndownloader/files/51487022
    file: pgc-mdd2025_no23andMe-noUKBB_eur_v3-49-24-11.tsv.gz
    md5: null
  scz2022:
    url: https://figshare.com/ndownloader/files/34517828
    file: PGC3_SCZ_wave3.european.autosome.public.v3.vcf.tsv.gz
    md5: null
  anx2024_adj_adhd2022:
    url: null
    file: anx2024_adj_adhd2022.fastGWA
    md5: null
  mdd2025_adj_adhd2022:
    url: null
    file: mdd2025_adj_adhd2022.fastGWA
    md5: null
  cortical_expansion:
    url: null
    file: cortical_expansion.fastGWA
    md5: null

##  00SETUP  -----------------------------------------------------------------------------

setup:
  get_containers:
    uris:
      prs: oras://quay.io/dazcam1/prs-bigsnpr:latest
    script: scripts/setup_pull_containers.sh
    output: ../resources/containers/.get_containers.done
    benchmark: reports/benchmarks/00setup.get_containers.benchmark.txt
    log: ../results/00LOG/00SETUP/get_containers.log
  get_prscs:
    repo: https://github.com/getian107/PRScs.git
    commit: fbc9ec017652f0b40a6ab47f63747d97fa7d033b
    dir: ../resources/software/PRScs
    output: ../resources/software/PRScs/.get_prscs.done
    benchmark: reports/benchmarks/00setup.get_prscs.benchmark.txt
    log: ../results/00LOG/00SETUP/get_prscs.log
  get_prscs_ref:
    url: https://www.dropbox.com/s/t9opx2ty6ucrpib/ldblk_ukbb_eur.tar.gz?dl=1
    tarball: ../resources/refs/ldblk_ukbb_eur.tar.gz
    dir: ../resources/refs
    ld_dir: ../resources/refs/ldblk_ukbb_eur
    output: ../resources/refs/ldblk_ukbb_eur/.get_prscs_ref.done
    benchmark: reports/benchmarks/00setup.get_prscs_ref.benchmark.txt
    log: ../results/00LOG/00SETUP/get_prscs_ref.log
  get_gwas_sumstats:
    dir: ../resources/gwas/{gwas}
    output: ../resources/gwas/{gwas}/.get_gwas_sumstats.done
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
    benchmark: reports/benchmarks/00setup.get_gwas_sumstats_{gwas}.benchmark.txt
    log: ../results/00LOG/00SETUP/get_gwas_sumstats_{gwas}.log

