##  00SETUP  --------------------------------------------------------------------------

setup:
  get_containers:
    uris:
      prs: oras://quay.io/dazcam1/prs-bigsnpr:latest
    script: scripts/setup_pull_containers.sh
    output: ../resources/containers/.get_containers.done
    benchmark: reports/benchmarks/00setup.get_containers.benchmark.txt
    log: ../results/00LOG/00SETUP/get_containers.log
  get_prscs:
    repo: https://github.com/getian107/PRScs.git
    commit: fbc9ec017652f0b40a6ab47f63747d97fa7d033b
    dir: ../resources/software/PRScs
    output: ../resources/software/PRScs/.get_prscs.done
    benchmark: reports/benchmarks/00setup.get_prscs.benchmark.txt
    log: ../results/00LOG/00SETUP/get_prscs.log
  get_prscs_ref:
    url: https://www.dropbox.com/s/t9opx2ty6ucrpib/ldblk_ukbb_eur.tar.gz?dl=1
    tarball: ../resources/refs/ldblk_ukbb_eur.tar.gz
    dir: ../resources/refs
    ld_dir: ../resources/refs/ldblk_ukbb_eur
    output: ../resources/refs/ldblk_ukbb_eur/.get_prscs_ref.done
    benchmark: reports/benchmarks/00setup.get_prscs_ref.benchmark.txt
    log: ../results/00LOG/00SETUP/get_prscs_ref.log
  get_gwas_sumstats:
    dir: ../resources/gwas/{gwas}
    figshare_token: ../config/passwords/figshare_token
    output: ../resources/gwas/{gwas}/.get_gwas_sumstats.done
    benchmark: reports/benchmarks/00setup.get_gwas_sumstats_{gwas}.benchmark.txt
    log: ../results/00LOG/00SETUP/get_gwas_sumstats_{gwas}.log

##  01GENOTYPES  ----------------------------------------------------------------------

genotypes:
  vcf: ../resources/genotypes/eqtl_atlas_genotypes.vcf.gz
  vcf_md5: "6e6b663b7d386e00078567ac78440178"
  sample_sheet: ../resources/sheets/eQTL_study_2025_sample_anns.xlsx
  euro_samples:
    sheet: Sheet1
    id_col: sample ID
    ancestry_col: ancestry
    ancestry: European
    script: ../scripts/geno_euro_samples.R
    output: ../results/01GENOTYPES/euro_samples.txt
    benchmark: reports/benchmarks/01genotypes.euro_samples.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/euro_samples.log
  subset_vcf:
    output: ../results/01GENOTYPES/eqtl_atlas_genotypes.euro.vcf.gz
    benchmark: reports/benchmarks/01genotypes.subset_vcf.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/subset_vcf.log
  vcf_to_plink:
    prefix: ../results/01GENOTYPES/eqtl_atlas_genotypes.euro
    output: ../results/01GENOTYPES/eqtl_atlas_genotypes.euro.bed
    benchmark: reports/benchmarks/01genotypes.vcf_to_plink.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/vcf_to_plink.log
  ld_prune:
    maf: 0.01
    indep_pairwise: 250 5 0.2
    prefix: ../results/01GENOTYPES/pca/ld_prune
    output: ../results/01GENOTYPES/pca/ld_prune.prune.in
    benchmark: reports/benchmarks/01genotypes.ld_prune.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/ld_prune.log
  genotype_pcs:
    pcs: 10
    prefix: ../results/01GENOTYPES/pca/pca
    output: ../results/01GENOTYPES/pca/pca.eigenvec
    benchmark: reports/benchmarks/01genotypes.genotype_pcs.benchmark.txt
    log: ../results/00LOG/01GENOTYPES/genotype_pcs.log

##  02PREP-GWAS  ----------------------------------------------------------------------

prep_gwas:
  format_gwas:
    filters:
      snv:        {apply: false}
      qc_cols:    {apply: false}
      info:       {apply: false, min: 0.8}
      ambiguous:  {apply: false}
      duplicates: {apply: true}
      low_n:      {apply: false, min_frac: 0.5}
    n_summary: median
    auto_maf: [0.1, 0.4]
    script: ../scripts/gwas_format.R
    sumstats: ../results/02PREP-GWAS/{gwas}/{gwas}.prscs.txt
    n_gwas: ../results/02PREP-GWAS/{gwas}/{gwas}.n_gwas.txt   # n_gwas from n_calc
    qc: ../results/02PREP-GWAS/{gwas}/{gwas}.qc.tsv
    qc_steps: ../results/02PREP-GWAS/{gwas}/{gwas}.qc_steps.tsv
    benchmark: reports/benchmarks/02prep_gwas.format_gwas_{gwas}.benchmark.txt
    log: ../results/00LOG/02PREP-GWAS/format_gwas_{gwas}.log

##  03PRS  ----------------------------------------------------------------------------

prs:
  n_sets: [n_st1, n_calc]
  n_primary: n_st1
  set_n_gwas:
    output: ../results/03PRS/{nset}/n_gwas/{gwas}.n_gwas.txt
    benchmark: reports/benchmarks/03prs.set_n_gwas_{nset}_{gwas}.benchmark.txt
    log: ../results/00LOG/03PRS/{nset}/set_n_gwas_{gwas}.log
  vcf_to_pgen:
    prefix: ../results/03PRS/genotypes/eqtl_atlas_genotypes.euro.dosage
    output: ../results/03PRS/genotypes/eqtl_atlas_genotypes.euro.dosage.pgen
    benchmark: reports/benchmarks/03prs.vcf_to_pgen.benchmark.txt
    log: ../results/00LOG/03PRS/vcf_to_pgen.log
  run_prscs:
    a: 1
    b: 0.5
    phi: 1.0e-2              # null = PRS-CS-auto
    n_iter: 1000
    n_burnin: 500
    thin: 5
    seed: 1
    env: ../envs/prscs.yaml
    out_prefix: ../results/03PRS/{nset}/prscs/{gwas}/{gwas}
    output: ../results/03PRS/{nset}/prscs/{gwas}/{gwas}_pst_eff_{tag}_chr{chr}.txt
    benchmark: reports/benchmarks/03prs.run_prscs_{nset}_{gwas}_{tag}_chr{chr}.benchmark.txt
    log: ../results/00LOG/03PRS/{nset}/run_prscs_{gwas}_{tag}_chr{chr}.log
  combine_weights:
    output: ../results/03PRS/{nset}/weights/{gwas}_{tag}.weights.txt
    benchmark: reports/benchmarks/03prs.combine_weights_{nset}_{gwas}_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/{nset}/combine_weights_{gwas}_{tag}.log
  score:
    prefix: ../results/03PRS/{nset}/scores/{gwas}_{tag}
    output: ../results/03PRS/{nset}/scores/{gwas}_{tag}.sscore
    benchmark: reports/benchmarks/03prs.score_{nset}_{gwas}_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/{nset}/score_{gwas}_{tag}.log
  combine_scores:
    sex_col: sex
    pcw_col: PCW
    script: ../scripts/prs_combine_scores.R
    scores: ../results/03PRS/{nset}/pgs_scores_{nset}_{tag}.tsv
    summary: ../results/03PRS/{nset}/pgs_summary_{nset}_{tag}.tsv
    benchmark: reports/benchmarks/03prs.combine_scores_{nset}_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/{nset}/combine_scores_{tag}.log
  prs_report:
    ancestry_inference: ../resources/sheets/ancestry_inference.txt # GenotypeQCtoHRC ancestry inference for all genotyped samples (eQTL study)
    ancestry_id_strip: "_FC$"        # regex removed from its IDs to match the sample sheet
    flag_donors: ["2143", "15821", "14404"]
    rmd: scripts/prs_report.Rmd
    html: reports/03PRS/03prs_report_{tag}.html
    bmark_dir: reports/benchmarks
    benchmark: reports/benchmarks/03prs.prs_report_{tag}.benchmark.txt
    log: ../results/00LOG/03PRS/prs_report_{tag}.log

##  04DATA-SHARING  -------------------------------------------------------------------
data_sharing:
  dir: ../results/04DATA-SHARING/share
  pseudobulk_csv: ../../eQTL_study_2025/results/02SCANPY/pseudobulk/{cell_type}_pseudobulk.csv
  cell_types: [Glu-UL, Glu-DL, GABA, NPC, OPC, MG, Endo-Peri,
               Glu-UL-0, Glu-UL-1, Glu-UL-2, Glu-DL-0, Glu-DL-1, Glu-DL-2,
               GABA-0, GABA-1, GABA-2, NPC-0, NPC-1, NPC-2]
  cell_type_labels: {"Glu-UL": "Glu-A", "Glu-DL": "Glu-B"}
  allowed_missing:
    "15183": [Glu-DL-1, NPC-0, NPC-2]          # Failed GeX QC
  share_scores:
    sex_values: [M, F]                         
    script: ../scripts/share_scores.R
    output: ../results/04DATA-SHARING/share/pgs_scores.tsv
    benchmark: reports/benchmarks/04data_sharing.share_scores.benchmark.txt
    log: ../results/00LOG/04DATA-SHARING/share_scores.log
  share_pseudobulk:
    script: ../scripts/share_pseudobulk.R
    output: ../results/04DATA-SHARING/share/pseudobulk/{label}.tsv.gz
    benchmark: reports/benchmarks/04data_sharing.share_pseudobulk_{label}.benchmark.txt
    log: ../results/00LOG/04DATA-SHARING/share_pseudobulk_{label}.log
  share_readme:
    title: "Polygenic scores and pseudobulk expression: {n_donors} fetal brain donors of European ancestry"
    ld_reference: UK Biobank European (ldblk_ukbb_eur), HapMap3 SNPs
    pca_software: PLINK v1.9.0-b.8                 # version that ran genotype_pcs
    code: Dazcam/pgs_2027
    script: ../scripts/share_readme.R
    output: ../results/04DATA-SHARING/share/README.txt
    benchmark: reports/benchmarks/04data_sharing.share_readme.benchmark.txt
    log: ../results/00LOG/04DATA-SHARING/share_readme.log
  share_tar:
    top_dir: pgs_2027_shared_data              # top folder inside the tarball
    md5sums: ../results/04DATA-SHARING/share/md5sums.txt          # packed in the tarball
    output: ../results/04DATA-SHARING/pgs_2027_shared_data.tar.gz
    md5: ../results/04DATA-SHARING/pgs_2027_shared_data.tar.gz.md5  # for checking the download
    benchmark: reports/benchmarks/04data_sharing.share_tar.benchmark.txt
    log: ../results/00LOG/04DATA-SHARING/share_tar.log

